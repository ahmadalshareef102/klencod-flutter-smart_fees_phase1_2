name: smart_fees
description: Smart Fees - إدارة الرسوم. نظام إدارة رسوم الطلاب والمعاهد (Offline First).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ">=2.5.0"
  go_router: ">=14.0.0"
  sqflite: ">=2.3.0"
  path: ">=1.9.0"
  intl: ">=0.19.0"
  path_provider: ^2.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"
  sqflite_common_ffi: ">=2.3.0"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
